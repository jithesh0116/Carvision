{% extends "base.html" %}
{% block title %}Prediction History · CarVision{% endblock %}
{% block content %}
<div class="container narrow">
  <h1 class="page-title">Prediction History</h1>
  <p class="muted">Estimates you generated in this browser.</p>
  <div id="list" class="history-list" aria-live="polite"><p class="muted">Loading…</p></div>
</div>
{% endblock %}
{% block scripts %}
<script>
(async function () {
  const list = document.getElementById('list');
  const res = await CV_API('/api/history');
  if (!res.ok) { list.innerHTML = '<div class="alert alert-warn">' + esc(res.error) + '</div>'; return; }
  if (!res.items.length) {
    list.innerHTML = '<div class="card empty"><p>No predictions yet.</p><a class="btn btn-primary" href="/predict">Predict My Car\'s Value</a></div>';
    return;
  }
  list.innerHTML = '<div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Vehicle</th><th>Year</th><th>Predicted Price</th><th></th></tr></thead><tbody>' +
    res.items.map(i => '<tr><td>' + esc(fmtDate(i.created_at)) + '</td><td>' + esc(i.brand + ' ' + i.model + (i.variant ? ' ' + i.variant : '')) +
      '</td><td>' + i.year + '</td><td><b>' + fmtMoney(i.predicted_price) + '</b></td><td class="row-actions"><a class="btn btn-ghost-dark btn-sm" href="/result/' + i.id + '">Open</a>' +
      '<button class="btn btn-link btn-sm" data-del="' + i.id + '" aria-label="Delete estimate">Delete</button></td></tr>').join('') + '</tbody></table></div>';
  list.addEventListener('click', async e => {
    const id = e.target.dataset && e.target.dataset.del;
    if (!id || !confirm('Delete this estimate?')) return;
    await CV_API('/api/history/' + id, { method: 'DELETE' });
    location.reload();
  });
})();
</script>
{% endblock %}
